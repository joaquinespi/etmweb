name: Deploy Astro + TinaCMS to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Evita que dos deploys modifiquen producción simultáneamente.
concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    # Evita workflows bloqueados indefinidamente.
    timeout-minutes: 20

    env:
      # ---------------------------------------------------------
      # TinaCMS
      # ---------------------------------------------------------
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      TINA_SEARCH_TOKEN: ${{ secrets.TINA_SEARCH_TOKEN }}

      # ---------------------------------------------------------
      # cPanel
      # ---------------------------------------------------------
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}

      # ---------------------------------------------------------
      # Deployment
      # ---------------------------------------------------------
      DEPLOY_PATH: ~/etmweb
      SITE_URL: https://fit-tan-parrot.106-0-62-104.cpanel.site

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. NODE
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      # =========================================================
      # 3. VALIDAR CONFIGURACIÓN
      # =========================================================
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          [ -n "$TINA_CLIENT_ID" ] || {
            echo "::error::TINA_CLIENT_ID no está configurado"
            exit 1
          }

          [ -n "$TINA_TOKEN" ] || {
            echo "::error::TINA_TOKEN no está configurado"
            exit 1
          }

          [ -n "$TINA_SEARCH_TOKEN" ] || {
            echo "::error::TINA_SEARCH_TOKEN no está configurado"
            exit 1
          }

          [ -n "$CPANEL_HOST" ] || {
            echo "::error::CPANEL_HOST no está configurado"
            exit 1
          }

          [ -n "$CPANEL_USER" ] || {
            echo "::error::CPANEL_USER no está configurado"
            exit 1
          }

          [ -n "$CPANEL_SSH_PORT" ] || {
            echo "::error::CPANEL_SSH_PORT no está configurado"
            exit 1
          }

          echo "✅ Deployment configuration OK"

      # =========================================================
      # 4. INFORMACIÓN DEL ENTORNO
      # =========================================================
      - name: Show environment versions
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "rsync: $(rsync --version | head -n 1)"

      # =========================================================
      # 5. DEPENDENCIAS
      # =========================================================
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # =========================================================
      # 6. BUILD
      # =========================================================
      - name: Build TinaCMS + Astro
        run: npm run build:cms

      # =========================================================
      # 7. VALIDAR BUILD
      # =========================================================
      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html || {
            echo "::error::dist/index.html no existe"
            exit 1
          }

          test -f dist/admin/index.html || {
            echo "::error::dist/admin/index.html no existe"
            exit 1
          }

          test -f dist/sitemap-index.xml || {
            echo "::warning::dist/sitemap-index.xml no existe"
          }

          echo "----------------------------------------"
          echo "✅ Astro website OK"
          echo "✅ TinaCMS admin OK"
          echo "----------------------------------------"

          echo "Archivos generados:"
          find dist -type f | wc -l

          echo "Tamaño del build:"
          du -sh dist

      # =========================================================
      # 8. CONFIGURAR SSH
      # =========================================================
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::CPANEL_SSH_PRIVATE_KEY no está configurado"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy

          ssh-keyscan \
            -p "$CPANEL_SSH_PORT" \
            -H "$CPANEL_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "✅ SSH configured"

      # =========================================================
      # 9. VALIDAR CLAVE PRIVADA
      # =========================================================
      - name: Validate SSH private key
        run: |
          ssh-keygen -y \
            -f ~/.ssh/cpanel_deploy \
            > /dev/null

          echo "✅ SSH private key valid"

      # =========================================================
      # 10. PROBAR CONEXIÓN
      # =========================================================
      - name: Test SSH connection
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/cpanel_deploy \
            -p "$CPANEL_SSH_PORT" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "echo '✅ SSH connection successful'"

      # =========================================================
      # 11. VALIDAR DESTINO
      # =========================================================
      - name: Verify cPanel destination
        run: |
          ssh \
            -o BatchMode=yes \
            -i ~/.ssh/cpanel_deploy \
            -p "$CPANEL_SSH_PORT" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "test -d $DEPLOY_PATH"

          echo "✅ $DEPLOY_PATH exists"

      # =========================================================
      # 12. DEPLOY
      # =========================================================
      - name: Deploy to cPanel
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying dist/ → $DEPLOY_PATH"

          rsync \
            -az \
            --delete \
            --delete-delay \
            --human-readable \
            --stats \
            --exclude=".well-known/" \
            --exclude=".htaccess" \
            -e "ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              -i ~/.ssh/cpanel_deploy \
              -p $CPANEL_SSH_PORT" \
            dist/ \
            "$CPANEL_USER@$CPANEL_HOST:$DEPLOY_PATH/"

          echo "✅ rsync completed"

      # =========================================================
      # 13. VALIDAR ARCHIVOS REMOTOS
      # =========================================================
      - name: Verify remote deployment
        run: |
          ssh \
            -o BatchMode=yes \
            -i ~/.ssh/cpanel_deploy \
            -p "$CPANEL_SSH_PORT" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "
              test -f $DEPLOY_PATH/index.html &&
              test -f $DEPLOY_PATH/admin/index.html
            "

          echo "✅ Remote files verified"

      # =========================================================
      # 14. HEALTH CHECK WEB
      # =========================================================
      - name: Verify production website
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            URL="$1"
            NAME="$2"

            echo "Checking $NAME..."

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 4 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              "$URL" \
              > /dev/null

            echo "✅ $NAME online"
          }

          check_url "$SITE_URL/" "Website"
          check_url "$SITE_URL/admin/" "TinaCMS Admin"

      # =========================================================
      # 15. RESUMEN
      # =========================================================
      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## 🚀 Deployment successful"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Astro build | ✅ |"
            echo "| TinaCMS admin | ✅ |"
            echo "| SSH | ✅ |"
            echo "| rsync | ✅ |"
            echo "| Remote files | ✅ |"
            echo "| Website | ✅ |"
            echo "| Admin | ✅ |"
            echo ""
            echo "### Environment"
            echo ""
            echo "- Node: $(node --version)"
            echo "- Target: \`$DEPLOY_PATH\`"
            echo "- URL: $SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # =========================================================
      # 16. LIMPIEZA
      # =========================================================
      - name: Cleanup SSH credentials
        if: always()
        run: |
          rm -f ~/.ssh/cpanel_deploy
name: Deploy Astro + TinaCMS to cPanel

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      TINA_SEARCH_TOKEN: ${{ secrets.TINA_SEARCH_TOKEN }}

      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}

    steps:
      # ---------------------------------------------------------
      # 1. Descargar repositorio
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Configurar Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      # ---------------------------------------------------------
      # 3. Mostrar versiones
      # ---------------------------------------------------------
      - name: Show versions
        run: |
          node --version
          npm --version

      # ---------------------------------------------------------
      # 4. Instalar dependencias
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ---------------------------------------------------------
      # 5. Build TinaCMS + Astro
      # ---------------------------------------------------------
      - name: Build website
        run: npm run build:cms

      # ---------------------------------------------------------
      # 6. Verificar archivos críticos
      # ---------------------------------------------------------
      - name: Verify build
        run: |
          test -f dist/index.html || {
            echo "ERROR: dist/index.html no existe"
            exit 1
          }

          test -f dist/admin/index.html || {
            echo "ERROR: dist/admin/index.html no existe"
            exit 1
          }

          echo "✅ Astro website OK"
          echo "✅ TinaCMS admin OK"

      # ---------------------------------------------------------
      # 7. Configurar SSH
      # ---------------------------------------------------------
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "$CPANEL_SSH_PORT" \
            -H "$CPANEL_HOST" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      # ---------------------------------------------------------
      # 8. Probar conexión SSH
      # ---------------------------------------------------------
      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$CPANEL_SSH_PORT" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "echo '✅ SSH connection successful'"

      # ---------------------------------------------------------
      # 9. Verificar carpeta destino
      # ---------------------------------------------------------
      - name: Verify cPanel destination
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$CPANEL_SSH_PORT" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "test -d ~/etmweb && echo '✅ ~/etmweb existe' || { echo '❌ ~/etmweb no existe'; exit 1; }"

      # ---------------------------------------------------------
      # 10. Deploy mediante rsync
      # ---------------------------------------------------------
      - name: Deploy to cPanel
        run: |
          rsync \
            -az \
            --delete \
            --exclude=".well-known/" \
            -e "ssh -i ~/.ssh/id_ed25519 -p $CPANEL_SSH_PORT" \
            dist/ \
            "$CPANEL_USER@$CPANEL_HOST:~/etmweb/"

      # ---------------------------------------------------------
      # 11. Verificación remota
      # ---------------------------------------------------------
      - name: Verify deployment
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$CPANEL_SSH_PORT" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "test -f ~/etmweb/index.html && test -f ~/etmweb/admin/index.html"

          echo "✅ Deployment completed successfully"
      # ---------------------------------------------------------
      # 13. comprobacion HTTP
      # ---------------------------------------------------------
      - name: Check production website
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://fit-tan-parrot.106-0-62-104.cpanel.site/" \
            > /dev/null

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://fit-tan-parrot.106-0-62-104.cpanel.site/admin/" \
            > /dev/null
          echo "✅ Website online"
          echo "✅ TinaCMS admin online"